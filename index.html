<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1822" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stairway City" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
  <meta name="description" content="עיר פתוחה תלת־ממדית לחקירה, נהיגה וטיסה." />
  <title>Stairway City Explorer — עיר פתוחה</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    #boot-status { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; padding: 24px; background: #0b1720; color: #f4f7fa; font-family: Rubik, sans-serif; text-align: center; }
    .boot-card { width: min(560px, 100%); padding: 30px; border: 1px solid #40515d; border-radius: 18px; background: #142633; box-shadow: 0 18px 70px #0008; }
    .boot-card h1 { margin: 0 0 14px; font-size: 24px; } .boot-card p { line-height: 1.7; color: #d1dce4; }
    .boot-hint { color: #9fd7ff !important; } .boot-spinner { width: 38px; height: 38px; margin: 0 auto 18px; border: 4px solid #40515d; border-top-color: #75c9ff; border-radius: 50%; animation: bootspin 1s linear infinite; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
    .boot-error button { margin: 12px; padding: 11px 22px; border: 0; border-radius: 10px; background: #75c9ff; color: #10202b; font: inherit; font-weight: 700; cursor: pointer; }
    .boot-error details { margin-top: 16px; text-align: right; } .boot-error pre { overflow-wrap: anywhere; white-space: pre-wrap; direction: ltr; text-align: left; color: #ffc7c7; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-status" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-spinner"></div>
      <h1>טוען את Stairway City Explorer…</h1>
      <p>המשחק טוען רכיבי תלת־ממד. בדרך כלל זה לוקח כמה שניות.</p>
      <p class="boot-hint">אם המסך נשאר כך, ייתכן שהמכשיר חסם רכיב תלת־ממדי. נסה לרענן את הדף.</p>
    </div>
  </div>
  <script src="%BASE_URL%boot.js" defer></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
